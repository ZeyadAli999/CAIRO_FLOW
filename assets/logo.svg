<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <defs>
    <linearGradient id="cf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="1"/>
    </linearGradient>
    <filter id="cf-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Subtle motion / connection arcs -->
  <path d="M 10 10 Q 6 18 10 26" stroke="url(#cf-grad)" stroke-width="1.5"
        fill="none" stroke-opacity="0.4" stroke-linecap="round"/>
  <path d="M 10 10 Q 18 7 26 12" stroke="url(#cf-grad)" stroke-width="1.5"
        fill="none" stroke-opacity="0.3" stroke-linecap="round"/>
  <path d="M 10 26 Q 18 29 26 24" stroke="url(#cf-grad)" stroke-width="1.5"
        fill="none" stroke-opacity="0.3" stroke-linecap="round"/>
  <!-- Three nodes forming a stylized C -->
  <circle cx="10" cy="10" r="3.5" fill="url(#cf-grad)" filter="url(#cf-glow)"/>
  <circle cx="10" cy="26" r="3.5" fill="url(#cf-grad)" filter="url(#cf-glow)"/>
  <circle cx="26" cy="18" r="3.5" fill="white" opacity="0.95" filter="url(#cf-glow)"/>
</svg>
